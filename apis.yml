name: Postini
description: 'Postini was an email security and message-management company founded in 1999, providing
  hosted spam and virus filtering, email archiving, encryption, and web security for businesses. Google
  acquired Postini in 2007 (roughly $625M) and folded its capabilities into Google Apps (now Google
  Workspace); the standalone Postini service was discontinued and customers were transitioned to Google
  Apps by around 2012. The postini.com domain is now Google-owned and redirects to google.com. This
  profile is retained as a historical portfolio-lead record; the company has no live, standalone API
  surface, developer portal, or documentation to enrich.'
